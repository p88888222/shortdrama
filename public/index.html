<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0d12; color: #e2e8f0; font-family: sans-serif; }
        .tab-active { color: #ef4444; border-bottom: 2px solid #ef4444; }
        ::-webkit-scrollbar { display: none; }
        
        .video-wrapper { 
            width: 100%; max-width: 400px; margin: 0 auto; 
            aspect-ratio: 16/9; background: #000; position: relative; 
        }
        video { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>
    <header class="sticky top-0 z-40 bg-[#0b0d12]/95 backdrop-blur-md border-b border-white/5 p-4">
        <div class="flex items-center justify-between gap-4 mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
            <div class="flex-1 bg-white/5 px-4 py-2 rounded-2xl border border-white/10 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 text-xs"></i>
                <input id="searchInput" type="text" placeholder="Cari CEO..." class="bg-transparent border-none outline-none text-xs w-full text-white">
            </div>
        </div>
        <nav class="flex gap-8 px-2 text-xs font-bold text-gray-500 uppercase tracking-widest">
            <button onclick="changeTab('foryou', this)" class="nav-btn tab-active">For You</button>
            <button onclick="changeTab('theaters', this)" class="nav-btn">Theaters</button>
        </nav>
    </header>

    <main class="p-4">
        <h2 id="sectionLabel" class="text-[10px] font-black text-gray-500 mb-4 tracking-widest uppercase italic">Memuat...</h2>
        <div id="mainContainer" class="grid grid-cols-3 gap-3"></div>
    </main>

    <div id="detailModal" class="fixed inset-0 bg-[#0b0d12] z-50 hidden flex flex-col h-full overflow-hidden">
        <div class="video-wrapper shadow-2xl relative">
            <video id="mainPlayer" playsinline controls controlsList="nodownload"></video>
            
            <div class="absolute bottom-2 left-2 z-50">
                <select id="qualitySelect" onchange="changeQuality()" class="bg-black/60 text-[8px] text-white border border-white/20 rounded px-1 py-0.5 outline-none">
                    <option value="1080">1080p</option>
                    <option value="720" selected>720p</option>
                    <option value="480">480p</option>
                </select>
            </div>

            <button onclick="closeModal()" class="absolute top-2 right-2 w-8 h-8 bg-black/60 rounded-full text-white flex items-center justify-center z-50">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="flex justify-center gap-10 py-3 bg-[#0b0d12] border-b border-white/5">
            <button onclick="playSibling(-1)" class="text-gray-400 hover:text-white transition flex flex-col items-center gap-1">
                <i class="fa-solid fa-backward-step text-lg"></i>
                <span class="text-[8px] font-bold">PREV</span>
            </button>
            <button onclick="playSibling(1)" class="text-gray-400 hover:text-white transition flex flex-col items-center gap-1">
                <i class="fa-solid fa-forward-step text-lg"></i>
                <span class="text-[8px] font-bold">NEXT</span>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-5 pt-4 pb-24 text-gray-200">
            <h1 id="modalTitle" class="text-lg font-bold mb-1 leading-tight text-white"></h1>
            <div id="modalLabels" class="flex flex-wrap gap-2 mb-3 text-[9px] font-bold text-red-500"></div>
            
            <div class="bg-white/5 p-4 rounded-xl mb-4 border border-white/5">
                <p id="modalDesc" class="text-xs text-gray-400 leading-relaxed italic mb-3"></p>
                <div class="border-t border-white/10 pt-2 flex justify-between items-center">
                    <span id="modalTotalEp" class="text-[10px] font-black text-red-600"></span>
                    <span class="text-[8px] text-gray-500 uppercase">Premium Drama</span>
                </div>
            </div>

            <div id="modalEpisodes" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
