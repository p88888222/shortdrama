<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShort Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background-color: #0b0b0b; color: white; font-family: sans-serif; }
        .tab-active { color: #ff4500; border-bottom: 3px solid #ff4500; font-weight: bold; }
        .drama-card { background: #161616; border: 1px solid #222; border-radius: 12px; transition: 0.2s; }
        .drama-card:active { transform: scale(0.98); background: #1f1f1f; }
        .vjs-big-play-centered .vjs-big-play-button { background-color: #ff4500 !important; border: none !important; border-radius: 50% !important; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen border-x border-zinc-900 shadow-2xl bg-black">

    <div class="sticky top-0 z-50 bg-black">
        <div class="aspect-video w-full bg-zinc-900 overflow-hidden shadow-lg">
            <video id="main-player" class="video-js vjs-fluid vjs-big-play-centered" playsinline></video>
        </div>
        
        <div class="flex justify-around bg-zinc-950 border-b border-zinc-800 py-4 font-bold text-[11px] tracking-widest uppercase">
            <button onclick="changeTab('foryou')" id="tab-foryou" class="pb-2">FOR YOU</button>
            <button onclick="changeTab('theaters')" id="tab-theaters" class="pb-2 text-zinc-500">THEATERS</button>
        </div>
    </div>

    <div id="main-content" class="p-4 space-y-4 pb-24">
        <div class="text-center py-20 text-zinc-600 text-sm animate-pulse">Menghubungkan ke API...</div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Gunakan Proxy untuk menembus CORS Railway
        const PROXY = "https://api.allorigins.win/raw?url=";
        const BASE_URL = "https://api.sansekai.my.id/api";
        
        const player = videojs('main-player', { 
            controls: true, 
            autoplay: false, 
            preload: 'auto',
            fluid: true
        });

        // 1. Fungsi Utama Ambil Drama
        async function changeTab(tabName) {
            const container = document.getElementById('main-content');
            
            // UI Tab
            document.getElementById('tab-foryou').className = tabName === 'foryou' ? 'tab-active pb-2' : 'text-zinc-500 pb-2';
            document.getElementById('tab-theaters').className = tabName === 'theaters' ? 'tab-active pb-2' : 'text-zinc-500 pb-2';
            
            container.innerHTML = '<div class="text-center py-20 text-zinc-700 text-sm italic">Mencari drama...</div>';

            try {
                const endpoint = tabName === 'foryou' ? '/netshort/foryou' : '/netshort/theaters';
                const finalUrl = PROXY + encodeURIComponent(BASE_URL + endpoint);
                
                const response = await fetch(finalUrl);
                const result = await response.json();

                // LOGIKA PENCARIAN DATA (Sesuai JSON contentInfos)
                let dramaList = [];
                if (result.data && result.data.contentInfos) {
                    dramaList = result.data.contentInfos;
                } else if (Array.isArray(result.data)) {
                    dramaList = result.data[0]?.contentInfos || result.data;
                }

                if (dramaList.length === 0) {
                    container.innerHTML = '<div class="text-center py-20 text-zinc-700 text-xs italic">Drama tidak ditemukan. Pastikan API mengirimkan contentInfos.</div>';
                    return;
                }

                container.innerHTML = "";
                dramaList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "drama-card flex gap-4 p-3 mb-3 cursor-pointer";
                    
                    // Gunakan shortPlayId dan shortPlayName dari JSON Anda
                    card.innerHTML = `
                        <img src="${item.coverUrl || 'https://via.placeholder.com/150x200?text=No+Cover'}" class="w-20 h-28 object-cover rounded-lg bg-zinc-800 shadow-md">
                        <div class="flex flex-col justify-center overflow-hidden">
                            <h3 class="text-sm font-bold text-zinc-100 truncate pr-4">${item.shortPlayName}</h3>
                            <div class="flex flex-wrap gap-1 mt-2">
                                ${item.labelArray ? item.labelArray.slice(0, 2).map(l => `<span class="text-[9px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-500 font-medium">${l}</span>`).join('') : ''}
                            </div>
                            <p class="text-[10px] text-orange-500 mt-4 font-bold uppercase tracking-widest">Tonton Sekarang →</p>
                        </div>
                    `;
                    // Klik untuk ke daftar episode
                    card.onclick = () => loadAllEpisodes(item.shortPlayId);
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-red-500 text-center py-20 text-xs">Gagal memuat API.<br>Penyebab: ${err.message}</div>`;
            }
        }

        // 2. Fungsi Ambil Episode per Drama
        async function loadAllEpisodes(shortPlayId) {
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="text-center py-20 text-zinc-600 text-sm">Mengambil daftar episode...</div>';

            try {
                const epUrl = `${BASE_URL}/netshort/allEpisode?shortPlayId=${shortPlayId}`;
                const response = await fetch(PROXY + encodeURIComponent(epUrl));
                const result = await response.json();
                const data = result.data; // shortPlayName & episodes[]

                container.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <button onclick="changeTab('foryou')" class="text-[10px] bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-full font-bold">← KEMBALI</button>
                        <h2 class="text-[10px] font-bold text-orange-500 truncate uppercase w-40 text-right">${data.shortPlayName}</h2>
                    </div>
                    <div class="space-y-2">
                        ${data.episodes.map(ep => `
                            <div onclick="playVideo('${ep.video_url}')" class="p-4 bg-zinc-900/50 rounded-xl flex justify-between items-center border border-zinc-800 hover:border-orange-500 transition">
                                <span class="text-sm font-medium">Episode ${ep.episode_number}</span>
                                <span class="text-orange-500 text-xs font-bold">PLAY</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                if(data.episodes.length > 0) playVideo(data.episodes[0].video_url);
            } catch (err) {
                container.innerHTML = '<div class="text-red-500 text-center py-20 text-xs">Gagal memuat daftar episode.</div>';
            }
        }

        // 3. Fungsi Putar Video
        function playVideo(url) {
            if (!url) return alert("Video tidak tersedia.");
            const type = url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
            player.src({ src: url, type: type });
            player.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Start
        document.addEventListener('DOMContentLoaded', () => changeTab('foryou'));
    </script>
</body>
</html>
