<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0d12; color: #f8fafc; font-family: sans-serif; }
        .nav-active { color: #ef4444 !important; border-bottom: 2px solid #ef4444; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .ep-active { background-color: rgba(239, 68, 68, 0.2) !important; border: 1px solid #ef4444 !important; color: #ef4444 !important; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/90 backdrop-blur-md p-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
        </div>
        <div class="glass px-4 py-2 rounded-full flex items-center gap-3 mb-4">
            <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
            <input id="searchInput" type="text" placeholder="Cari drama..." class="bg-transparent border-none outline-none text-sm w-full text-white">
        </div>
        <nav class="flex justify-around border-b border-white/5">
            <button onclick="switchView('foryou', this)" class="nav-item nav-active pb-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 transition">For You</button>
            <button onclick="switchView('home', this)" class="nav-item pb-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 transition">Terbaru</button>
            <button onclick="switchView('hot', this)" class="nav-item pb-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 transition">Hot</button>
            <button onclick="switchView('library', this)" class="nav-item pb-2 text-[10px] font-bold uppercase tracking-widest text-gray-500 transition">Library</button>
        </nav>
    </header>

    <main id="appContent" class="p-4 space-y-8 min-h-screen"></main>

    <div id="detailModal" class="fixed inset-0 z-[60] bg-[#0b0d12] hidden flex flex-col overflow-hidden">
        <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
            <button onclick="closeModal()" class="w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
            <div id="modalAction" class="flex gap-2"></div>
        </div>

        <div class="flex-1 overflow-y-auto">
            <div class="w-full bg-black aspect-video relative sticky top-0 z-20">
                <video id="mainPlayer" class="w-full h-full" controls playsinline></video>
            </div>

            <div class="p-6">
                <h2 id="modalTitle" class="text-xl font-bold mb-1">Judul Drama</h2>
                <div id="modalTotalEp" class="text-red-500 text-[10px] font-bold mb-4 uppercase">... Total Episode</div>
                <div class="glass p-4 rounded-2xl mb-6">
                    <p id="modalDesc" class="text-gray-400 text-xs leading-relaxed italic"></p>
                </div>

                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4">Daftar Episode</h3>
                <div id="modalEpisodes" class="grid grid-cols-1 gap-2 pb-20"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
