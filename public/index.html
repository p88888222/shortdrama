<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN BOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tab-active { color: white; border-bottom: 2px solid red; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0f1117] text-gray-200 font-sans select-none">

    <div class="sticky top-0 z-40 bg-[#0f1117]/80 backdrop-blur-lg">
        <div class="p-4 flex items-center justify-between">
            <h1 class="text-xl font-black text-red-600 tracking-tighter">DRAMAXIN</h1>
            <div class="bg-white/5 px-3 py-1 rounded-full border border-white/10">
                <input id="searchInput" type="text" placeholder="Cari drama..." class="bg-transparent border-none outline-none text-xs w-24 focus:w-40 transition-all">
            </div>
        </div>
        <div class="flex gap-6 px-4 pb-2 overflow-x-auto text-sm font-bold text-gray-500">
            <button onclick="changeTab('foryou', this)" class="nav-btn tab-active whitespace-nowrap">FOR YOU</button>
            <button onclick="changeTab('theaters', this)" class="nav-btn whitespace-nowrap">THEATERS</button>
        </div>
    </div>

    <div class="p-4">
        <h2 id="sectionLabel" class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">FOR YOU</h2>
        <div id="mainContainer" class="grid grid-cols-3 gap-3">
            </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="relative w-full aspect-[9/16] bg-black flex items-center justify-center">
            <div id="playerContainer" class="w-full h-full hidden">
                <video id="mainPlayer" class="w-full h-full" playsinline></video>
                <button onclick="closeModal()" class="absolute top-4 left-4 p-2 bg-black/40 rounded-full text-white"><i class="fa-solid fa-chevron-left"></i></button>
            </div>
        </div>
        
        <div class="flex-1 bg-[#0f1117] rounded-t-3xl -mt-6 z-10 p-6 overflow-y-auto border-t border-white/5">
            <h1 id="modalTitle" class="text-lg font-bold mb-2"></h1>
            <p id="modalDesc" class="text-xs text-gray-500 leading-relaxed mb-6"></p>
            
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold text-red-500">DAFTAR EPISODE</span>
                <div class="flex gap-4">
                    <button id="prevBtn" class="text-white bg-white/10 p-2 rounded-lg"><i class="fa-solid fa-backward"></i></button>
                    <button id="nextBtn" class="text-white bg-white/10 p-2 rounded-lg"><i class="fa-solid fa-forward"></i></button>
                </div>
            </div>
            <div id="modalEpisodes" class="space-y-2 pb-10"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
