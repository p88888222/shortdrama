<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN - Home Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d12; color: #f8fafc; }
        ::-webkit-scrollbar { display: none; }
        .nav-active { color: #ef4444 !important; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .video-wrapper { 
            width: 100%; max-width: 260px; margin: 15px auto; 
            aspect-ratio: 4/6; background: #000; position: relative; 
            border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/90 backdrop-blur-xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
            <div class="w-10 h-10 rounded-full glass-card flex items-center justify-center">
                <i class="fa-solid fa-user text-xs"></i>
            </div>
        </div>
        <div class="glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
            <input id="searchInput" type="text" placeholder="Cari CEO, Balas Dendam..." class="bg-transparent border-none outline-none text-sm w-full text-white">
        </div>
    </header>

    <main id="appContent" class="p-4 space-y-8">
        </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0d12]/95 backdrop-blur-lg border-t border-white/5 flex justify-around py-4 z-50">
        <button onclick="switchView('home', this)" class="nav-item nav-active flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </button>
        <button onclick="switchView('hot', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-fire text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Hot</span>
        </button>
        <button onclick="switchView('library', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-bookmark text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Library</span>
        </button>
    </nav>

    <div id="detailModal" class="fixed inset-0 bg-[#0b0d12] z-[60] hidden flex flex-col h-full overflow-hidden">
        <div class="video-wrapper shadow-2xl group">
            <video id="mainPlayer" playsinline controls></video>
            <button onclick="closeModal()" class="absolute top-2 right-2 w-8 h-8 bg-black/60 rounded-full text-white flex items-center justify-center">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="flex justify-center gap-12 py-3 bg-[#0b0d12] border-b border-white/5">
            <button onclick="playSibling(-1)" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                <i class="fa-solid fa-backward-step text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Prev</span>
            </button>
            <button onclick="playSibling(1)" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
                <i class="fa-solid fa-forward-step text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Next</span>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-24">
            <h1 id="modalTitle" class="text-lg font-bold text-white mb-1 leading-tight"></h1>
            <div id="modalTotalEp" class="text-[10px] font-black text-red-600 uppercase mb-3"></div>
            <div class="glass-card p-4 rounded-xl mb-6">
                <p id="modalDesc" class="text-xs text-gray-400 leading-relaxed italic"></p>
            </div>
            <div id="modalEpisodes" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
