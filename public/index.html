<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0b0d12; color: #f8fafc; font-family: sans-serif; overflow-x: hidden; }
        .nav-active { color: #ef4444 !important; }
        .ep-active { background-color: rgba(239, 68, 68, 0.2) !important; border: 1px solid #ef4444 !important; color: #ef4444 !important; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/95 backdrop-blur-md p-4 border-b border-white/5">
        <h1 class="text-2xl font-black text-red-600 italic mb-4">DRAMAXIN</h1>
        <div class="glass px-4 py-2 rounded-xl flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-xs"></i>
            <input id="searchInput" type="text" placeholder="Cari drama..." class="bg-transparent border-none outline-none text-xs w-full text-white">
        </div>
    </header>

    <main id="appContent" class="p-4 space-y-8 min-h-screen"></main>

    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0b0d12]/95 border-t border-white/5 px-6 py-3 flex justify-between">
        <button onclick="switchView('home', this)" class="nav-item nav-active flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold uppercase">Home</span>
        </button>
        <button onclick="switchView('foryou', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-compass text-lg"></i><span class="text-[9px] font-bold uppercase">For You</span>
        </button>
        <button onclick="switchView('hot', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-fire text-lg"></i><span class="text-[9px] font-bold uppercase">Hot</span>
        </button>
        <button onclick="switchView('library', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-clapperboard text-lg"></i><span class="text-[9px] font-bold uppercase">Library</span>
        </button>
    </nav>

    <div id="detailModal" class="fixed inset-0 z-[60] bg-[#0b0d12] hidden flex flex-col overflow-hidden">
        <div class="p-4 flex justify-between items-center fixed top-0 w-full z-30">
            <button onclick="closeModal()" class="w-10 h-10 glass rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-chevron-left"></i></button>
            <div id="modalAction"></div>
        </div>
        <div class="flex-1 overflow-y-auto">
            <video id="mainPlayer" class="w-full aspect-video bg-black sticky top-0 z-20" controls playsinline></video>
            <div class="p-6">
                <h2 id="modalTitle" class="text-xl font-bold mb-1"></h2>
                <div id="modalTotalEp" class="text-red-500 text-[10px] font-bold mb-4 uppercase"></div>
                <div class="glass p-4 rounded-2xl mb-6"><p id="modalDesc" class="text-gray-400 text-xs italic"></p></div>
                <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-4">Daftar Episode</h3>
                <div id="modalEpisodes" class="space-y-2 pb-20"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
