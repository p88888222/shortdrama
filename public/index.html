<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d12; color: #f8fafc; }
        ::-webkit-scrollbar { display: none; }
        .nav-active { color: #ef4444 !important; font-weight: 800; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/90 backdrop-blur-xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
            <div class="w-10 h-10 rounded-full glass-card flex items-center justify-center">
                <i class="fa-solid fa-user text-xs"></i>
            </div>
        </div>
        <div class="glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
            <input id="searchInput" type="text" placeholder="Cari drama atau CEO..." class="bg-transparent border-none outline-none text-sm w-full text-white placeholder:text-gray-600">
        </div>
    </header>

    <main id="appContent" class="p-4">
        </main>

    <div id="pagination" class="flex justify-center gap-4 py-6 hidden">
        <button id="prevPage" class="glass-card px-4 py-2 rounded-xl text-xs font-bold">Prev</button>
        <span id="pageNumber" class="flex items-center text-xs font-bold">Page 1</span>
        <button id="nextPage" class="glass-card px-4 py-2 rounded-xl text-xs font-bold">Next</button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0d12]/95 backdrop-blur-lg border-t border-white/5 flex justify-around py-4 z-50">
        <button onclick="switchView('home', this)" class="nav-item nav-active flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button onclick="switchView('hot', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-fire text-xl"></i>
            <span class="text-[10px] font-bold">Hot</span>
        </button>
        <button onclick="switchView('library', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-bookmark text-xl"></i>
            <span class="text-[10px] font-bold">Library</span>
        </button>
    </nav>

    <div id="detailModal" class="fixed inset-0 bg-[#0b0d12] z-[60] hidden flex flex-col h-full overflow-hidden">
        <div class="w-full max-w-[280px] aspect-[9/16] bg-black mx-auto mt-4 rounded-2xl overflow-hidden relative border border-white/5">
            <video id="mainPlayer" class="w-full h-full object-cover" playsinline controls></video>
            <button onclick="closeModal()" class="absolute top-3 left-3 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <button id="bookmarkBtn" class="absolute top-3 right-3 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center">
                <i class="fa-regular fa-bookmark"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-6 pt-6 pb-24">
            <h1 id="modalTitle" class="text-xl font-bold mb-2"></h1>
            <div id="modalLabels" class="flex flex-wrap gap-2 mb-4 text-[10px] font-bold text-red-500 uppercase"></div>
            <p id="modalDesc" class="text-xs text-gray-400 leading-relaxed mb-6 italic"></p>
            <div id="modalEpisodes" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
