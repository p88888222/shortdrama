<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN - Pro Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d12; color: #f8fafc; }
        ::-webkit-scrollbar { display: none; }
        .nav-active { color: #ef4444 !important; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Custom Seekbar */
        input[type=range] { height: 4px; border-radius: 5px; background: rgba(255,255,255,0.2); appearance: none; }
        input[type=range]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #ef4444; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body class="pb-24">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/90 backdrop-blur-xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
        </div>
        <div class="glass-card px-4 py-2.5 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
            <input id="searchInput" type="text" placeholder="Cari drama..." class="bg-transparent border-none outline-none text-sm w-full text-white">
        </div>
    </header>

    <main id="appContent" class="p-4 space-y-8"></main>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#0b0d12]/95 backdrop-blur-lg border-t border-white/5 flex justify-around py-4 z-50">
        <button onclick="switchView('home', this)" class="nav-item nav-active flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Home</span>
        </button>
        <button onclick="switchView('hot', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-fire text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Hot</span>
        </button>
        <button onclick="switchView('library', this)" class="nav-item flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-bookmark text-xl"></i>
            <span class="text-[10px] font-bold uppercase">Library</span>
        </button>
    </nav>

    <div id="detailModal" class="fixed inset-0 bg-[#0b0d12] z-[60] hidden flex flex-col h-full overflow-hidden">
        <div class="relative w-full max-w-[320px] aspect-[9/16] mx-auto mt-2 bg-black rounded-2xl overflow-hidden shadow-2xl group">
            <video id="mainPlayer" class="w-full h-full object-cover" playsinline></video>
            
            <div class="absolute inset-0 flex flex-col justify-between p-4 bg-gradient-to-t from-black/80 via-transparent to-black/40 opacity-100 group-hover:opacity-100 transition-opacity">
                <div class="flex justify-between items-start">
                    <button onclick="closeModal()" class="w-10 h-10 bg-black/20 backdrop-blur-md rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    <div class="flex flex-col gap-2">
                        <select id="qualitySelect" onchange="changeQuality()" class="bg-black/40 text-[10px] p-1 rounded border border-white/10 outline-none">
                            <option value="1080">1080P</option>
                            <option value="720" selected>720P</option>
                            <option value="480">480P</option>
                        </select>
                        <button onclick="toggleFullscreen()" class="w-8 h-8 bg-black/20 rounded-lg flex items-center justify-center"><i class="fa-solid fa-expand text-xs"></i></button>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex flex-col gap-1">
                        <input type="range" id="seekBar" value="0" step="0.1" class="w-full accent-red-600">
                        <div class="flex justify-between text-[8px] font-bold text-gray-400">
                            <span id="curTime">00:00</span>
                            <span id="durTime">00:00</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-6">
                            <button onclick="playSibling(-1)"><i class="fa-solid fa-backward-step"></i></button>
                            <button onclick="togglePlay()" class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white"><i id="playIcon" class="fa-solid fa-play ml-1"></i></button>
                            <button onclick="playSibling(1)"><i class="fa-solid fa-forward-step"></i></button>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-volume-high text-[10px]"></i>
                            <input type="range" id="volBar" min="0" max="1" step="0.1" value="1" class="w-12">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pt-4 pb-24">
            <h1 id="modalTitle" class="text-lg font-bold text-white mb-1 leading-tight"></h1>
            <div id="modalTotalEp" class="text-[10px] font-black text-red-600 uppercase mb-3"></div>
            <div class="glass-card p-4 rounded-xl mb-6"><p id="modalDesc" class="text-xs text-gray-400 leading-relaxed italic"></p></div>
            <div id="modalEpisodes" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
