<script>
    // URL ini sekarang memanggil server proxy buatan kita sendiri
    const PROXY = "/api-proxy?url="; 
    const BASE_API = "https://api.sansekai.my.id/api";
    
    const videoPlayer = videojs('player', { controls: true, autoplay: false, fluid: true });

    async function loadTab(tabName) {
        const container = document.getElementById('main-content');
        document.getElementById('tab-foryou').className = tabName === 'foryou' ? 'tab-active pb-1' : 'text-zinc-500 pb-1';
        document.getElementById('tab-theaters').className = tabName === 'theaters' ? 'tab-active pb-1' : 'text-zinc-500 pb-1';
        
        container.innerHTML = '<div class="text-center py-20">Menghubungkan ke Server Sendiri...</div>';

        try {
            const endpoint = tabName === 'foryou' ? '/netshort/foryou' : '/netshort/theaters';
            const targetUrl = BASE_API + endpoint;
            
            // Memanggil /api-proxy?url=...
            const response = await fetch(PROXY + encodeURIComponent(targetUrl));
            const result = await response.json();

            let dramaList = result.data?.contentInfos || (Array.isArray(result.data) ? result.data[0]?.contentInfos : []);

            if (!dramaList || dramaList.length === 0) {
                container.innerHTML = '<div class="text-center py-20">Data masih kosong.</div>';
                return;
            }

            container.innerHTML = "";
            dramaList.forEach(item => {
                const card = document.createElement('div');
                card.className = "drama-card flex gap-4 p-3 rounded-xl cursor-pointer bg-zinc-900/40 mb-3 border border-zinc-800/50";
                card.innerHTML = `
                    <img src="${item.coverUrl}" class="w-20 h-28 object-cover rounded-lg">
                    <div class="flex flex-col justify-center">
                        <h3 class="text-sm font-bold truncate w-48">${item.shortPlayName}</h3>
                        <p class="text-[10px] text-orange-500 mt-2 font-bold">TONTON SEKARANG</p>
                    </div>
                `;
                card.onclick = () => loadEpisodes(item.shortPlayId);
                container.appendChild(card);
            });
        } catch (err) {
            container.innerHTML = `<div class="text-center py-20">Server Proxy Error: ${err.message}</div>`;
        }
    }

    async function loadEpisodes(id) {
        const container = document.getElementById('main-content');
        container.innerHTML = '<div class="text-center py-20 italic">Memuat list...</div>';
        try {
            const target = `${BASE_API}/netshort/allEpisode?shortPlayId=${id}`;
            const res = await fetch(PROXY + encodeURIComponent(target));
            const result = await res.json();
            const data = result.data;

            container.innerHTML = `
                <button onclick="loadTab('foryou')" class="mb-4 text-xs text-zinc-500 underline">← Kembali</button>
                <div class="space-y-2">
                    ${data.episodes.map(ep => `
                        <div onclick="playVideo('${ep.video_url}')" class="p-4 bg-zinc-900 rounded-lg flex justify-between border border-zinc-800">
                            <span class="text-sm font-medium text-zinc-200">Episode ${ep.episode_number}</span>
                            <span class="text-orange-500 text-xs font-bold">PLAY</span>
                        </div>
                    `).join('')}
                </div>`;
            if (data.episodes.length > 0) playVideo(data.episodes[0].video_url);
        } catch (e) { container.innerHTML = 'Gagal memuat episode.'; }
    }

    function playVideo(url) {
        if (!url) return;
        const type = url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
        videoPlayer.src({ src: url, type: type });
        videoPlayer.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => loadTab('foryou'));
</script>
