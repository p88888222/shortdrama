<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN - Box Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d12; color: #f8fafc; overflow-x: hidden; }
        .tab-active { color: #ffffff; font-weight: 800; position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 16px; height: 3px; background: #ef4444; border-radius: 10px; }
        ::-webkit-scrollbar { display: none; }
        
        /* Video Container ala Netshort (Portrait Slim) */
        .video-wrapper { 
            width: 100%; max-width: 280px; margin: 0 auto; 
            aspect-ratio: 9/16; background: #000; position: relative; 
            border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="pb-20">

    <header class="sticky top-0 z-40 bg-[#0b0d12]/80 backdrop-blur-xl p-4">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-2xl font-black text-red-600 italic tracking-tighter">DRAMAXIN</h1>
            <button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center">
                <i class="fa-solid fa-user text-xs"></i>
            </button>
        </div>
        
        <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 mb-4">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm"></i>
            <input id="searchInput" type="text" placeholder="Search for dramas, tags..." class="bg-transparent border-none outline-none text-sm w-full text-white placeholder:text-gray-600">
        </div>

        <nav class="flex gap-8 px-2 text-sm font-bold text-gray-500 uppercase tracking-widest">
            <button onclick="changeTab('foryou', this)" class="nav-btn tab-active">For You</button>
            <button onclick="changeTab('theaters', this)" class="nav-btn">Theaters</button>
        </nav>
    </header>

    <main class="p-4">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-1 h-4 bg-red-600 rounded-full"></div>
            <h2 id="sectionLabel" class="text-xs font-black text-gray-400 uppercase tracking-widest">Discover</h2>
        </div>
        <div id="mainContainer" class="grid grid-cols-3 gap-3"></div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-[#0b0d12]/90 backdrop-blur-lg border-t border-white/5 flex justify-around py-3 z-50">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center gap-1 text-red-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-fire text-lg"></i>
            <span class="text-[10px] font-bold">Hot</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <span class="text-[10px] font-bold">Library</span>
        </button>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-[#0b0d12] z-[60] hidden flex flex-col h-full overflow-hidden">
        <div class="video-wrapper mt-4">
            <video id="mainPlayer" playsinline></video>
            <button onclick="closeModal()" class="absolute top-3 left-3 w-8 h-8 bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            
            <div class="absolute bottom-3 left-3 right-3 flex justify-between items-center opacity-0 hover:opacity-100 transition-opacity">
                <select id="qualitySelect" onchange="changeQuality()" class="bg-black/60 text-[9px] text-white px-2 py-1 rounded-lg border border-white/10 outline-none">
                    <option value="1080">1080P</option>
                    <option value="720" selected>720P</option>
                    <option value="480">480P</option>
                </select>
                <button onclick="toggleFullscreen()" class="w-7 h-7 bg-black/40 rounded-lg text-white flex items-center justify-center">
                    <i class="fa-solid fa-expand text-[10px]"></i>
                </button>
            </div>
        </div>

        <div class="flex justify-center gap-14 py-4 mt-2">
            <button onclick="playSibling(-1)" class="text-gray-400 hover:text-white transition flex flex-col items-center">
                <i class="fa-solid fa-backward-step text-xl"></i>
                <span class="text-[9px] mt-1 font-bold">PREV</span>
            </button>
            <button onclick="togglePlay()" class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg shadow-red-600/20">
                <i id="playIcon" class="fa-solid fa-play ml-1 text-lg"></i>
            </button>
            <button onclick="playSibling(1)" class="text-gray-400 hover:text-white transition flex flex-col items-center">
                <i class="fa-solid fa-forward-step text-xl"></i>
                <span class="text-[9px] mt-1 font-bold">NEXT</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-6 pt-2 pb-24">
            <h1 id="modalTitle" class="text-xl font-bold text-white mb-2 leading-tight"></h1>
            <div class="flex gap-2 mb-4">
                <span id="modalTotalEp" class="text-[10px] font-black text-red-500 bg-red-500/10 px-2 py-1 rounded border border-red-500/10"></span>
                <span class="text-[10px] font-bold text-gray-500 bg-white/5 px-2 py-1 rounded uppercase">Trending</span>
            </div>

            <div class="glass-panel p-4 rounded-2xl mb-6">
                <p id="modalDesc" class="text-xs text-gray-400 leading-relaxed italic"></p>
            </div>

            <h3 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-4">Episode List</h3>
            <div id="modalEpisodes" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
