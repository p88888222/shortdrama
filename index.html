<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShort Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background-color: #0b0b0b; color: white; }
        .tab-active { color: #ff4500; border-bottom: 2px solid #ff4500; }
        .vjs-big-play-centered .vjs-big-play-button { background-color: #ff4500; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen border-x border-zinc-900 shadow-2xl">

    <div class="sticky top-0 z-50 bg-black">
        <div class="aspect-video w-full bg-zinc-900">
            <video id="player" class="video-js vjs-fluid vjs-big-play-centered" playsinline></video>
        </div>
        <div class="flex justify-around bg-zinc-950 border-b border-zinc-800 text-[11px] font-bold py-4">
            <button onclick="changeTab('foryou')" id="tab-foryou" class="pb-1">FOR YOU</button>
            <button onclick="changeTab('theaters')" id="tab-theaters" class="pb-1 text-zinc-500">THEATERS</button>
        </div>
    </div>

    <div id="content" class="p-4 space-y-4 pb-20">
        <div class="text-center py-20 text-zinc-600">Memulai aplikasi...</div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // Gunakan Proxy untuk menembus blokir CORS browser
        const PROXY = "https://api.allorigins.win/raw?url=";
        const BASE_API = "https://api.sansekai.my.id/api";
        
        const videoPlayer = videojs('player', { controls: true, autoplay: false });

        async function changeTab(tabName) {
            const container = document.getElementById('content');
            document.getElementById('tab-foryou').className = tabName === 'foryou' ? 'tab-active pb-1' : 'text-zinc-500 pb-1';
            document.getElementById('tab-theaters').className = tabName === 'theaters' ? 'tab-active pb-1' : 'text-zinc-500 pb-1';
            
            container.innerHTML = '<div class="text-center py-20 text-zinc-500">Menghubungkan ke API...</div>';

            try {
                const endpoint = tabName === 'foryou' ? '/netshort/foryou' : '/netshort/theaters';
                // Menggabungkan Proxy + URL API
                const response = await fetch(PROXY + encodeURIComponent(BASE_API + endpoint));
                const result = await response.json();

                let dramaList = [];
                if (result.data?.contentInfos) {
                    dramaList = result.data.contentInfos;
                } else if (Array.isArray(result.data)) {
                    dramaList = result.data[0]?.contentInfos || result.data;
                }

                container.innerHTML = "";
                dramaList.forEach(drama => {
                    const card = document.createElement('div');
                    card.className = "flex gap-4 p-3 bg-zinc-900/50 rounded-xl cursor-pointer hover:bg-zinc-800 transition";
                    card.innerHTML = `
                        <img src="${drama.coverUrl}" class="w-20 h-28 object-cover rounded-lg">
                        <div class="flex flex-col justify-center overflow-hidden">
                            <h3 class="text-sm font-bold truncate">${drama.shortPlayName}</h3>
                            <p class="text-[10px] text-zinc-500 mt-1 uppercase tracking-widest">Tonton Sekarang</p>
                        </div>
                    `;
                    card.onclick = () => loadEpisodes(drama.shortPlayId);
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-red-500 text-center py-10 text-xs">Gagal memuat data.<br>Error: ${err.message}</div>`;
            }
        }

        async function loadEpisodes(shortPlayId) {
            const container = document.getElementById('content');
            container.innerHTML = '<div class="text-center py-20">Mengambil daftar episode...</div>';

            try {
                const url = `${BASE_API}/netshort/allEpisode?shortPlayId=${shortPlayId}`;
                const res = await fetch(PROXY + encodeURIComponent(url));
                const result = await res.json();
                const data = result.data;

                container.innerHTML = `
                    <div class="flex items-center gap-2 mb-4">
                        <button onclick="changeTab('foryou')" class="text-xs text-zinc-500 underline">Kembali</button>
                    </div>
                    <h2 class="font-bold text-sm mb-4">${data.shortPlayName}</h2>
                    <div class="space-y-2">
                        ${data.episodes.map(ep => `
                            <div onclick="play('${ep.video_url}')" class="p-4 bg-zinc-900 rounded-lg flex justify-between border border-zinc-800">
                                <span class="text-sm">Episode ${ep.episode_number}</span>
                                <span class="text-orange-500">▶</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                if(data.episodes.length > 0) play(data.episodes[0].video_url);
            } catch (err) {
                container.innerHTML = '<div class="text-red-500 text-center">Gagal memuat episode.</div>';
            }
        }

        function play(url) {
            if(!url) return alert("Video tidak tersedia.");
            const type = url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
            videoPlayer.src({ src: url, type: type });
            videoPlayer.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => changeTab('foryou'));
    </script>
</body>
</html>
