<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShort - Nonton Drama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background-color: #000; color: white; }
        .tab-active { color: #ff4500; border-bottom: 2px solid #ff4500; }
        .vjs-big-play-centered .vjs-big-play-button { background-color: #ff4500; border: none; }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div class="sticky top-0 z-50 bg-black shadow-lg">
        <div class="aspect-video w-full bg-zinc-900">
            <video id="main-player" class="video-js vjs-fluid" playsinline></video>
        </div>
        
        <div class="flex justify-around bg-zinc-950 py-3 text-xs font-bold border-b border-zinc-800">
            <button onclick="changeTab('foryou')" id="tab-foryou" class="pb-1 transition-all">FOR YOU</button>
            <button onclick="changeTab('theaters')" id="tab-theaters" class="pb-1 transition-all">THEATERS</button>
        </div>
    </div>

    <div id="content-area" class="p-4 space-y-4 pb-20">
        <p class="text-center text-zinc-500 mt-10">Memuat konten...</p>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
