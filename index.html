<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetShort Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background-color: #0b0b0b; color: white; font-family: sans-serif; }
        .tab-active { color: #ff4500; border-bottom: 3px solid #ff4500; font-weight: bold; }
        .drama-card { background: #161616; border: 1px solid #222; border-radius: 12px; }
        .vjs-big-play-centered .vjs-big-play-button { background-color: #ff4500 !important; border: none !important; border-radius: 50% !important; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen border-x border-zinc-900 bg-black">

    <div class="sticky top-0 z-50 bg-black">
        <div class="aspect-video w-full bg-zinc-900 overflow-hidden shadow-lg">
            <video id="main-player" class="video-js vjs-fluid vjs-big-play-centered" playsinline></video>
        </div>
        <div class="flex justify-around bg-zinc-950 border-b border-zinc-800 py-4 font-bold text-[11px] tracking-widest uppercase">
            <button onclick="changeTab('foryou')" id="tab-foryou" class="pb-2">FOR YOU</button>
            <button onclick="changeTab('theaters')" id="tab-theaters" class="pb-2 text-zinc-500">THEATERS</button>
        </div>
    </div>

    <div id="main-content" class="p-4 space-y-4 pb-24">
        <div id="status-msg" class="text-center py-20 text-zinc-600 text-sm italic">Memulai aplikasi...</div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // Mencoba proxy alternatif yang lebih simpel
        const PROXY_URL = "https://corsproxy.io/?";
        const API_BASE = "https://api.sansekai.my.id/api";
        
        const player = videojs('main-player', { controls: true, autoplay: false, fluid: true });

        async function changeTab(tabName) {
            const container = document.getElementById('main-content');
            document.getElementById('tab-foryou').className = tabName === 'foryou' ? 'tab-active pb-2' : 'text-zinc-500 pb-2';
            document.getElementById('tab-theaters').className = tabName === 'theaters' ? 'tab-active pb-2' : 'text-zinc-500 pb-2';
            
            container.innerHTML = '<div class="text-center py-20 text-zinc-700 text-sm italic">Menghubungkan ke API...</div>';

            try {
                const targetUrl = `${API_BASE}/netshort/${tabName}`;
                // Menggunakan corsproxy.io yang tidak butuh encode rumit
                const response = await fetch(PROXY_URL + targetUrl);
                
                // Cek jika response bukan JSON (misal HTML error page)
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    console.error("Bukan JSON:", text);
                    throw new Error("API tidak memberikan data JSON (Mungkin diblokir)");
                }

                const result = await response.json();
                
                // Cari contentInfos
                let dramaList = [];
                if (result.data) {
                    dramaList = result.data.contentInfos || (Array.isArray(result.data) ? result.data[0]?.contentInfos : []);
                }

                if (!dramaList || dramaList.length === 0) {
                    container.innerHTML = '<div class="text-center py-20 text-zinc-500 text-[10px] uppercase tracking-tighter">Drama tidak ditemukan.</div>';
                    return;
                }

                container.innerHTML = "";
                dramaList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "drama-card flex gap-4 p-3 mb-3 cursor-pointer";
                    card.innerHTML = `
                        <img src="${item.coverUrl || 'https://via.placeholder.com/150x200'}" class="w-20 h-28 object-cover rounded-lg bg-zinc-800">
                        <div class="flex flex-col justify-center overflow-hidden">
                            <h3 class="text-sm font-bold text-zinc-100 truncate pr-4">${item.shortPlayName}</h3>
                            <p class="text-[10px] text-orange-500 mt-4 font-bold uppercase tracking-widest">Tonton →</p>
                        </div>
                    `;
                    card.onclick = () => loadAllEpisodes(item.shortPlayId);
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-red-500 text-center py-20 text-[10px]">Error: ${err.message}<br>API Sansekai mungkin memproteksi akses.</div>`;
            }
        }

        async function loadAllEpisodes(id) {
            const container = document.getElementById('main-content');
            container.innerHTML = '<div class="text-center py-20 text-zinc-600 text-sm">Memuat Episode...</div>';

            try {
                const targetUrl = `${API_BASE}/netshort/allEpisode?shortPlayId=${id}`;
                const response = await fetch(PROXY_URL + targetUrl);
                const result = await response.json();
                const data = result.data;

                container.innerHTML = `
                    <div class="flex items-center justify-between mb-6">
                        <button onclick="changeTab('foryou')" class="text-[9px] bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full font-bold uppercase">Kembali</button>
                        <h2 class="text-[10px] font-bold text-orange-500 truncate uppercase w-40 text-right">${data.shortPlayName}</h2>
                    </div>
                    <div class="space-y-2">
                        ${data.episodes.map(ep => `
                            <div onclick="playVideo('${ep.video_url}')" class="p-4 bg-zinc-900/50 rounded-xl flex justify-between items-center border border-zinc-800">
                                <span class="text-sm font-medium">Episode ${ep.episode_number}</span>
                                <span class="text-orange-500 font-bold">▶</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = '<div class="text-red-500 text-center py-20 text-[10px]">Gagal memuat episode.</div>';
            }
        }

        function playVideo(url) {
            if (!url) return alert("Video tidak tersedia.");
            const type = url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4';
            player.src({ src: url, type: type });
            player.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', () => changeTab('foryou'));
    </script>
</body>
</html>
