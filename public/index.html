<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAMAXIN - Nonton Drama Pendek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f1117;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-active {
            color: #ef4444; /* Red-500 */
            position: relative;
        }

        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background-color: #ef4444;
            border-radius: 10px;
        }

        /* Sembunyikan Scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .animate-slideUp {
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-200">

    <header class="sticky top-0 z-40 bg-[#0f1117]/80 backdrop-blur-xl border-b border-white/5">
        <div class="p-4 flex items-center justify-between">
            <h1 class="text-2xl font-black text-red-600 tracking-tighter italic">DRAMAXIN</h1>
            <div class="glass px-4 py-2 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-gray-500 text-xs"></i>
                <input id="searchInput" type="text" placeholder="Cari drama viral..." 
                       class="bg-transparent border-none outline-none text-xs w-28 focus:w-40 transition-all text-white placeholder:text-gray-600">
            </div>
        </div>
        <nav class="flex gap-8 px-6 pb-4 text-xs font-extrabold text-gray-500 uppercase tracking-widest">
            <button onclick="changeTab('foryou', this)" class="nav-btn tab-active">For You</button>
            <button onclick="changeTab('theaters', this)" class="nav-btn">Theaters</button>
        </nav>
    </header>

    <main class="p-4">
        <div class="flex items-center gap-2 mb-6">
            <div class="w-1 h-4 bg-red-600 rounded-full"></div>
            <h2 id="sectionLabel" class="text-xs font-black text-gray-400 uppercase tracking-widest">Memuat...</h2>
        </div>
        
        <div id="mainContainer" class="grid grid-cols-3 gap-3">
            </div>
    </main>

    <div id="detailModal" class="fixed inset-0 bg-[#0f1117] z-50 hidden flex flex-col h-full">
        <div class="relative w-full aspect-video bg-black shadow-2xl flex items-center justify-center">
            <div id="playerContainer" class="w-full h-full hidden">
                <video id="mainPlayer" class="w-full h-full" playsinline controls></video>
            </div>
            <button onclick="closeModal()" class="absolute top-4 left-4 p-2 bg-black/40 backdrop-blur-md rounded-full text-white z-50 hover:bg-red-600 transition">
                <i class="fa-solid fa-xmark w-5 h-5 flex items-center justify-center"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto px-5 pt-6 pb-24">
            <h1 id="modalTitle" class="text-xl font-black text-white mb-2 leading-tight"></h1>
            
            <div class="flex gap-3 mb-4">
                <span class="text-[10px] font-black text-red-500 bg-red-500/10 px-2 py-1 rounded-lg border border-red-500/20" id="modalTotalEp"></span>
                <span class="text-[10px] font-bold text-gray-400 bg-white/5 px-2 py-1 rounded-lg border border-white/5 uppercase">Trending #1</span>
            </div>

            <p id="modalDesc" class="text-xs text-gray-500 leading-relaxed mb-8 bg-white/5 p-4 rounded-2xl italic border-l-4 border-red-600"></p>
            
            <div class="flex items-center justify-between mb-6 sticky top-0 bg-[#0f1117]/95 py-2 z-10">
                <h3 class="text-xs font-black tracking-widest text-white border-b-2 border-red-600 pb-1">DAFTAR EPISODE</h3>
                <div class="flex gap-2">
                    <button id="prevBtn" class="glass w-10 h-10 rounded-xl hover:bg-red-600 transition flex items-center justify-center">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button id="nextBtn" class="glass w-10 h-10 rounded-xl hover:bg-red-600 transition flex items-center justify-center">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="modalEpisodes" class="grid grid-cols-1 gap-4">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
