<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dramaxin - Nonton Drama Pendek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-active { color: #ef4444; border-bottom: 2px solid #ef4444; }
        .ep-active { background: rgba(239, 68, 68, 0.1); border-color: #ef4444 !important; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#0f0f0f] text-gray-200 font-sans selection:bg-red-500/30">

    <header class="sticky top-0 z-50 bg-[#0f0f0f]/80 backdrop-blur-md border-b border-white/5 px-4 py-3">
        <div class="flex items-center gap-4">
            <h1 class="text-red-600 font-black text-xl tracking-tighter">DRAMAXIN</h1>
            <div class="flex-1 relative">
                <input type="text" id="searchInput" placeholder="Cari judul drama..." 
                    class="w-full bg-white/5 border border-white/10 rounded-full py-2 px-4 pl-10 text-xs focus:outline-none focus:border-red-600 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-2.5 text-gray-500 text-[10px]"></i>
            </div>
        </div>
        <nav class="flex justify-around mt-4">
            <button onclick="switchView('foryou', this)" class="nav-item nav-active text-[10px] font-bold pb-2 uppercase tracking-widest">For You</button>
            <button onclick="switchView('home', this)" class="nav-item text-[10px] font-bold pb-2 uppercase tracking-widest">Terbaru</button>
            <button onclick="switchView('hot', this)" class="nav-item text-[10px] font-bold pb-2 uppercase tracking-widest">Populer</button>
            <button onclick="switchView('library', this)" class="nav-item text-[10px] font-bold pb-2 uppercase tracking-widest">Library</button>
        </nav>
    </header>

    <main id="appContent" class="p-4 pb-24 min-h-screen">
        </main>

    <div id="detailModal" class="fixed inset-0 z-[60] bg-black hidden overflow-y-auto">
        <div class="sticky top-0 z-10 p-4 flex justify-between items-start bg-gradient-to-b from-black to-transparent" id="playerHeader">
            <button onclick="closeModal()" class="w-10 h-10 glass-card rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
            <div id="playerHeaderRight" class="flex gap-2"></div>
        </div>

        <div class="max-w-md mx-auto">
            <div class="relative aspect-video bg-black w-full sticky top-0">
                <video id="mainPlayer" class="w-full h-full" playsinline></video>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <i id="playIcon" class="fa-solid fa-play text-4xl text-white/50 opacity-0 transition-opacity"></i>
                </div>
            </div>

            <div class="p-4">
                <h2 id="modalTitle" class="text-lg font-bold mb-1">Judul Drama</h2>
                <div id="modalTotalEp" class="text-red-500 text-[10px] font-bold mb-4">... EPISODE</div>
                <p id="modalDesc" class="text-gray-400 text-xs leading-relaxed mb-6 line-clamp-3" onclick="this.classList.toggle('line-clamp-3')"></p>
                
                <h3 class="text-[10px] font-bold uppercase tracking-widest mb-4 text-gray-500">Daftar Episode</h3>
                <div id="modalEpisodes" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
